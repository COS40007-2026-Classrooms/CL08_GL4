name: Auto Retrain on New Data

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/retrain-on-push.yml'
      - 'data/*.csv'
      - 'src/**'
      - 'requirements.txt'
      - 'dvc.yaml'
      - 'dvc.lock'

  pull_request:
    branches: [ main ]

  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  monitor-and-retrain:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Cache pip
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. Git config
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      # 5. Install dependencies
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc

      # 6. Configure DVC remote
      - name: Configure DVC remote
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user "${{ secrets.DAGSHUB_USERNAME }}"
          dvc remote modify origin --local password "${{ secrets.DAGSHUB_TOKEN }}"

      # 7. Pull DVC data
      - name: Pull latest DVC data
        run: |
          dvc pull --force --allow-missing || echo "DVC pull completed with warnings"

      # 8. Check for new data
      - name: Check for new data
        run: |
          echo "Checking for newly added data..."

          if [ -f "data/new_data.csv" ]; then
            echo "NEW_DATA=true" >> $GITHUB_ENV
            echo "New data detected"
          else
            echo "NEW_DATA=false" >> $GITHUB_ENV
            echo "No new data found"
          fi

      # 9. Combine datasets (only if new data exists)
      - name: Combine datasets
        if: env.NEW_DATA == 'true'
        run: |
          python -c "
          import pandas as pd
          import os
          import shutil
          from datetime import datetime

          old = 'data/Obesity.csv'
          new = 'data/new_data.csv'
          processed = 'data/processed'

          if os.path.exists(old) and os.path.exists(new):
              old_df = pd.read_csv(old)
              new_df = pd.read_csv(new)

              combined = pd.concat([old_df, new_df], ignore_index=True)
              combined = combined.drop_duplicates().dropna()

              combined.to_csv(old, index=False)

              os.makedirs(processed, exist_ok=True)
              ts = datetime.now().strftime('%Y%m%d_%H%M%S')
              shutil.move(new, f'{processed}/new_data_{ts}.csv')

              print('Data merged successfully')
          else:
              print('Missing data files')
          "

      # 10. PREPROCESS (IMPORTANT FIX 🔴)
      - name: Preprocess data (generate artifacts)
        run: |
          echo "Running preprocessing..."
          python src/preprocess.py

      # 11. RUN MONITORING BEFORE TRAINING (NOW SAFE)
      - name: Run monitoring before retraining
        run: |
          echo "Running monitoring before retraining..."
          python src/monitor.py || echo "Monitoring warnings only"

      # 12. Train model (only if new data exists)
      - name: Retrain model
        if: env.NEW_DATA == 'true'
        run: |
          echo "=========================================="
          echo "RETRAINING MODEL"
          echo "=========================================="
          python src/model.py

      # 13. Post-training monitoring
      - name: Run monitoring after retraining
        if: env.NEW_DATA == 'true'
        run: |
          echo "Running post-training monitoring..."
          python src/monitor.py

      # 14. Save metadata
      - name: Save metadata
        if: env.NEW_DATA == 'true'
        run: |
          mkdir -p artifacts/metadata
          echo "Last retraining: $(date)" > artifacts/metadata/last_retrain.txt
          echo "Data source: data/new_data.csv" >> artifacts/metadata/last_retrain.txt

      # 15. Push to DVC
      - name: Push to DVC
        if: env.NEW_DATA == 'true'
        run: |
          dvc push || echo "DVC push completed with warnings"

      # 16. Commit changes
      - name: Commit updates
        if: env.NEW_DATA == 'true'
        run: |
          git add data/Obesity.csv data/processed/ artifacts/ metadata/ models/ || true

          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-retrain pipeline update"
            git push
          fi

      # 17. Upload artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ml-results-${{ github.run_id }}
          path: |
            artifacts/
            monitoring/reports/
            models/
          retention-days: 7

      # 18. Final message
      - name: Pipeline complete
        run: |
          echo "=========================================="
          echo "PIPELINE COMPLETED"
          echo "=========================================="

          if [ "${{ env.NEW_DATA }}" = "true" ]; then
            echo "New data detected → retraining executed"
          else
            echo "No new data → only preprocessing + monitoring ran"
          fi