name: Auto Train ML Model

on:
  push:
    branches: [ main ]   # runs every time you push to main
  pull_request:
    branches: [ main ]   # runs on pull requests to main
  workflow_dispatch:     # allows manual trigger from GitHub UI
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC

jobs:
  train:
    runs-on: ubuntu-latest   # GitHub-hosted Linux runner

    steps:
      # 1. Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Cache pip packages
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Git configuration for DVCLive to commit metrics and artifacts
      - name: Configure Git User for DVCLive
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      # 4. Install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Configure DVC Remote
      - name: Configure DVC remote
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user "${{ secrets.DAGSHUB_USERNAME }}"
          dvc remote modify origin --local password "${{ secrets.DAGSHUB_TOKEN }}"
          
      # Pull dataset from DVC
      - name: Pull DVC data
        run: dvc pull data/Obesity.csv.dvc

      # 5. Preprocess new data
      - name: Preprocess new data
        run: python src/preprocess_new_data.py

      # Check generated files
      - name: Check artifacts after preprocessing
        run: |
          echo "Checking artifacts/data folder"
          ls -la artifacts/data

      # 6. Train the model
      - name: Train model
        run: python src/model.py

      # 7. Run monitoring
      - name: Run monitoring
        run: python src/monitor.py

      # 8. Upload results as artefacts
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: model-results
          path: |
            artifacts/models/
            artifacts/metrics/
            monitoring/reports/
            artifacts/preprocessing/
            artifacts/model_comparison.png

