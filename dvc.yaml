stages:
  preprocess:
    cmd: python src/preprocess_new_data.py
    deps:
    - data/Obesity.csv
    - src/preprocess_new_data.py
    outs:
    - artifacts/data
    - artifacts/preprocessing
  train:
    cmd: python src/model.py
    deps:
    - artifacts/data
    - src/model.py
    outs:
    - artifacts/models/best_model.pkl
    - artifacts/feature_columns.json
    - artifacts/target_column.json
  monitor:
    cmd: python src/monitor.py
    deps:
    - artifacts/data
    - artifacts/models/best_model.pkl
    - src/monitor.py
    outs:
    - artifacts/metrics/monitoring_metrics.json
    - monitoring/reports/drift_report.json
